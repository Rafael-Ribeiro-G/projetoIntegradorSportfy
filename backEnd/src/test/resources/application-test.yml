# Testes: banco H2 em memória com a MESMA estrutura do banco do Enzo (schema-enzo-h2.sql).
spring:
  datasource:
    url: jdbc:h2:mem:sportfy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-enzo-h2.sql
      data-locations: classpath:esportes-teste.sql
  jpa:
    hibernate:
      ddl-auto: none

sportfy:
  jwt:
    secret: chave-de-teste-com-mais-de-32-caracteres-para-hmac-sha256
    expiracao-minutos: 60
  cors:
    origens-permitidas: http://localhost:3000
  login:
    max-tentativas: 3
    bloqueio-minutos: 15
  uploads:
    pasta: target/uploads-teste

logging:
  level:
    root: WARN
