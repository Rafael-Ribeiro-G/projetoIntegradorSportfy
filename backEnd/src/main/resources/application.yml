server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework

spring:
  application:
    name: sportfy-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sportfy}
    username: ${DB_USER:back_sportfy}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      # Tabelas são criadas pelo Flyway; aqui o Hibernate só confere se batem com as entidades
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
        # todas as tabelas ficam no schema próprio do Sportfy (padrão "sportfy"),
        # separadas de qualquer coisa que já exista no "public" do servidor
        default_schema: ${DB_SCHEMA:sportfy}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # o Flyway cria o schema se ele não existir e roda as migrations dentro dele
    schemas: ${DB_SCHEMA:sportfy}
    default-schema: ${DB_SCHEMA:sportfy}
    create-schemas: true
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

sportfy:
  jwt:
    # Gere com: openssl rand -base64 64   (mínimo 32 caracteres)
    secret: ${JWT_SECRET:}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:1440}
    emissor: sportfy-api
  cors:
    # Lista separada por vírgula. Ex: http://localhost:3000,https://sportfy.vercel.app
    origens-permitidas: ${CORS_ORIGENS:http://localhost:3000}
  login:
    max-tentativas: ${LOGIN_MAX_TENTATIVAS:5}
    bloqueio-minutos: ${LOGIN_BLOQUEIO_MINUTOS:15}
  admin:
    # Se preenchidos, cria o administrador na primeira subida
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    br.senai.sportfy: ${LOG_LEVEL:INFO}
