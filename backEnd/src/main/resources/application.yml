server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework

spring:
  application:
    name: sportfy-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sportfy}
    username: ${DB_USER:back_sportfy}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      # As tabelas são do banco do Enzo (schema public). A API NÃO cria nem altera tabelas:
      # o Hibernate só confere, na subida, se as tabelas e colunas que ela usa existem.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
        default_schema: ${DB_SCHEMA:public}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

sportfy:
  jwt:
    # Gere com: openssl rand -base64 64   (mínimo 32 caracteres)
    secret: ${JWT_SECRET:}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:1440}
    emissor: sportfy-api
  cors:
    # Lista separada por vírgula. Ex: http://localhost:3000,https://sportfy.vercel.app
    origens-permitidas: ${CORS_ORIGENS:http://localhost:3000}
  login:
    max-tentativas: ${LOGIN_MAX_TENTATIVAS:5}
    bloqueio-minutos: ${LOGIN_BLOQUEIO_MINUTOS:15}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    br.senai.sportfy: ${LOG_LEVEL:INFO}
