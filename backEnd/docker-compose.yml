# Ambiente LOCAL completo (API + PostgreSQL) para desenvolvimento e para o time de front/mobile testar.
#   docker compose up -d --build
#   API:     http://localhost:8080
#   Swagger: http://localhost:8080/swagger-ui.html
#
# Na primeira subida o Postgres local é criado com a MESMA estrutura do banco do servidor
# (sql/estrutura_banco_enzo.sql + sql/02_evolucao_espacos_esportivos.sql) e com os 12 esportes.
# Para recriar do zero (apaga os dados locais):  docker compose down -v && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: sportfy-db
    environment:
      POSTGRES_DB: sportfy
      POSTGRES_USER: back_sportfy
      POSTGRES_PASSWORD: sportfy_local
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - sportfy-dados-v3:/var/lib/postgresql/data
      - ./sql/estrutura_banco_enzo.sql:/docker-entrypoint-initdb.d/01-estrutura.sql:ro
      - ./sql/01_esportes_iniciais.sql:/docker-entrypoint-initdb.d/02-esportes.sql:ro
      - ./sql/02_evolucao_espacos_esportivos.sql:/docker-entrypoint-initdb.d/03-evolucao.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U back_sportfy -d sportfy"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: sportfy-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/sportfy
      DB_USER: back_sportfy
      DB_PASSWORD: sportfy_local
      # segredo só para desenvolvimento local
      JWT_SECRET: segredo-local-de-desenvolvimento-nao-usar-em-producao
      CORS_ORIGENS: http://localhost:3000,http://localhost:8081,http://localhost:19006
    ports:
      - "8080:8080"

volumes:
  # "-v3": bancos locais de versões anteriores não são reaproveitados
  sportfy-dados-v3:
